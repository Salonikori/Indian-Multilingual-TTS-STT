name: Build iTantra APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Download model files
        run: |
          pip install requests
          python scripts/download_models.py
          du -sh app/src/main/assets/models/

      - name: Check model files are real (warning only)
        run: |
          M=app/src/main/assets/models
          for f in hi/stt/model.int8.onnx hi/tts/model.onnx hi/tts/espeak-ng-data/phontab \
                   en/stt/encoder.int8.onnx en/stt/decoder.int8.onnx \
                   en/tts/model.onnx en/tts/espeak-ng-data/phontab; do
            if [ ! -s "$M/$f" ]; then
              echo "::warning::Missing model file: $f (speech features will not work for that part)"
            fi
          done

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK and report size
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          test -f "$APK" || { echo "APK not created"; exit 1; }
          ls -lh "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iTantra-debug-apk
          path: ${{ env.APK_PATH }}
          retention-days: 30

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: app/build/reports/
          retention-days: 7